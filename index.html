<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="utf-8" />
	<title>cratequest1</title>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<!-- Die einzige Datei ohne Versionskennung im Namen, also die einzige, die
	     nicht gecacht werden darf. Sie verweist auf alle übrigen. -->
	<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
	<meta http-equiv="Pragma" content="no-cache" />
	<meta http-equiv="Expires" content="0" />
	<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	<style>
		:root {
			color-scheme: dark;
		}

		html,
		body {
			margin: 0;
			height: 100%;
			background-color: #0f0f0f;
			color: #f0f0f0;
			font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
		}

		canvas {
			display: block;
			width: 100vw;
			height: 100vh;
			outline: none;
		}

		#status-container {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			display: flex;
			flex-direction: column;
			gap: 0.75rem;
			min-width: 260px;
			max-width: min(90vw, 40rem);
			padding: 1.5rem 2rem;
			border-radius: 0.75rem;
			background-color: rgba(15, 15, 15, 0.82);
			box-shadow: 0 1.25rem 3rem rgba(0, 0, 0, 0.45);
			text-align: center;
		}

		#status-text {
			font-size: 1.1rem;
			font-weight: 500;
			white-space: pre-line;
		}

		#status-progress {
			width: 100%;
			height: 0.75rem;
		}
	</style>
</head>
<body>
	<canvas id="canvas" tabindex="0"></canvas>
	<div id="status-container" role="status" aria-live="polite">
		<span id="status-text">Lädt…</span>
		<progress id="status-progress" value="0" max="1" hidden></progress>
	</div>
	<script>
		// Wird von bin/export_web.sh durch das Verzeichnis dieses Builds ersetzt,
		// etwa "v/8bdf382/index". Bleibt der Platzhalter stehen - etwa bei einem
		// Export direkt aus dem Editor -, liegen die Dateien unversioniert
		// daneben und alles läuft wie bei einem normalen Export.
		const BUILD_BASE = "v/9e32d9e/index";

		const statusContainer = document.getElementById("status-container");
		const statusText = document.getElementById("status-text");
		const statusProgress = document.getElementById("status-progress");
		const canvas = document.getElementById("canvas");

		// Der Preloader meldet über requestAnimationFrame noch Fortschritt, nachdem
		// startGame() bereits aufgelöst hat. Würde setStatus die Anzeige selbst
		// einblenden, käme sie dadurch über dem laufenden Spiel zurück - deshalb
		// wird ab dem Start nichts mehr angezeigt.
		let starting = true;

		function setStatus(text, current, total) {
			if (!starting) {
				return;
			}
			statusText.textContent = text;
			if (total > 0) {
				statusProgress.hidden = false;
				statusProgress.max = total;
				statusProgress.value = current;
			} else {
				statusProgress.hidden = true;
			}
		}

		function hideStatus() {
			starting = false;
			statusContainer.style.display = "none";
		}

		function showError(message, err) {
			if (err !== undefined) {
				console.error(err);
			}
			setStatus(message, 0, 0);
			starting = false;
		}

		const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":1407888,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
		const GODOT_THREADS_ENABLED = false;

		GODOT_CONFIG.canvas = canvas;
		GODOT_CONFIG.onProgress = function (current, total) {
			setStatus(total > 0 ? `Lädt… ${(100 * current / total) | 0}%` : "Lädt…", current, total);
		};

		// Aus `executable` leitet die Engine jede weitere Datei ab: .wasm, .pck
		// und über ihr eigenes locateFile auch die Audio-Worklets. Ein Build
		// liegt deshalb komplett in einem eigenen Verzeichnis, und es genügt,
		// hier dessen Pfad zu setzen - dann kann kein Browser Teile aus zwei
		// verschiedenen Builds miteinander kombinieren.
		if (BUILD_BASE.charAt(0) !== "$") {
			const original = GODOT_CONFIG.executable;
			const sizes = {};
			for (const name in GODOT_CONFIG.fileSizes) {
				sizes[BUILD_BASE + name.slice(original.length)] = GODOT_CONFIG.fileSizes[name];
			}
			GODOT_CONFIG.fileSizes = sizes;
			GODOT_CONFIG.executable = BUILD_BASE;
		}

		function startGame() {
			const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
			if (missing.length !== 0) {
				showError(`Dieser Browser kann das Spiel nicht ausführen.\nEs fehlt: ${missing.join(", ")}`);
				return;
			}
			const engine = new Engine(GODOT_CONFIG);
			engine.startGame()
				.then(hideStatus)
				.catch(function (err) {
					showError("Fehler beim Starten des Spiels.", err);
				});
		}

		const script = document.createElement("script");
		script.src = `${GODOT_CONFIG.executable}.js`;
		script.async = true;
		script.addEventListener("error", function (event) {
			showError("Engine-Skript konnte nicht geladen werden.", event);
		});
		script.addEventListener("load", function () {
			try {
				startGame();
			} catch (err) {
				showError("Fehler beim Initialisieren der Engine.", err);
			}
		});
		document.body.appendChild(script);
	</script>
</body>
</html>
